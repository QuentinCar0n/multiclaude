# Builds MultiClaude on every v* tag and publishes the zip as a GitHub release.
# The tag sets the version: v1.1 builds MultiClaude-1.1.zip with CFBundleShortVersionString 1.1.
# A tag with a suffix (v1.4-rc1) publishes a pre-release, which installed copies and the cask ignore.
# Release notes come from the matching "## <version>" section of CHANGELOG.md.
# The signing key (UPDATE_SIGNING_KEY) lives in the "release" environment, which only v* tags can use,
# so the build job never sees it. Actions are pinned to commits so an upstream change can't reach the key.
# With a HOMEBREW_TAP_TOKEN secret (fine-grained PAT, contents write on QuentinCar0n/homebrew-tap),
# the release job also bumps the cask. Run by hand (workflow_dispatch) to build without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci"; fi
          # The version lands in file names, Info.plist and the cask, so only plain versions get through.
          [[ "$v" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]] || { echo "Bad version '$v' from tag $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          swiftc --version
          ./build.sh --no-install
          lipo -archs build/MultiClaude.app/Contents/MacOS/MultiClaude
          codesign -v build/MultiClaude.app
          build/MultiClaude.app/Contents/MacOS/MultiClaude --selftest-update
          build/MultiClaude.app/Contents/MacOS/MultiClaude --selftest-version
          build/MultiClaude.app/Contents/MacOS/MultiClaude --selftest-profiles
          build/MultiClaude.app/Contents/MacOS/MultiClaude --selftest-signin
          build/MultiClaude.app/Contents/MacOS/MultiClaude --selftest-launchers
          build/MultiClaude.app/Contents/MacOS/MultiClaude --selftest-awake

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MultiClaude-${{ env.VERSION }}
          path: build/MultiClaude-${{ env.VERSION }}.zip

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MultiClaude-${{ env.VERSION }}
          path: build

      # Installed copies only accept an update whose zip carries this signature.
      - name: Sign
        env:
          MULTICLAUDE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$MULTICLAUDE_SIGNING_KEY" || { echo "UPDATE_SIGNING_KEY secret is missing"; exit 1; }
          ditto -x -k "build/MultiClaude-$VERSION.zip" build/app
          bin=build/app/MultiClaude.app/Contents/MacOS/MultiClaude
          $bin --sign-update "build/MultiClaude-$VERSION.zip" > "build/MultiClaude-$VERSION.zip.sig"
          $bin --verify-update "build/MultiClaude-$VERSION.zip" "build/MultiClaude-$VERSION.zip.sig"
          shasum -a 256 "build/MultiClaude-$VERSION.zip" | tee build/sha256.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            /^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v; next }
            on' CHANGELOG.md > build/notes.md
          cat >> build/notes.md <<'NOTES'

          **Install:** `brew install --cask quentincar0n/tap/multiclaude`, or unzip and move MultiClaude.app to Applications. The app is not notarized, so right-click it and choose Open the first time.
          NOTES
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags=(--prerelease)
          else
            # A fix tagged on an older line must not become "latest": installed copies and the cask follow latest.
            newest=$(git ls-remote --tags origin 'v*' | sed -E 's|.*refs/tags/v||; /\^\{\}$/d; /-/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
            if [[ "$newest" != "$VERSION" ]]; then flags=(--latest=false); echo "IS_LATEST=false" >> "$GITHUB_ENV"; fi
          fi
          gh release create "$GITHUB_REF_NAME" "build/MultiClaude-$VERSION.zip" "build/MultiClaude-$VERSION.zip.sig" \
            --title "MultiClaude $VERSION" --notes-file build/notes.md "${flags[@]}"

      - name: Bump Homebrew cask
        if: env.HAS_TAP_TOKEN == 'true' && !contains(env.VERSION, '-') && env.IS_LATEST != 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}   # only this step sees the token
        run: |
          SHA=$(cut -d' ' -f1 build/sha256.txt)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/QuentinCar0n/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/multiclaude.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "multiclaude $VERSION"
          git push
