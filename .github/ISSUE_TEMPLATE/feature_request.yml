name: Feature request
description: Suggest an idea for MultiClaude
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How MultiClaude could help. Optional.
